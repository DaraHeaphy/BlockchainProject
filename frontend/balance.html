<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

<body>
  <header>
    <a href="index.html" class="back">← Home</a>
    <h1>Balance Check</h1>
  </header>
  <div class="section">
    <h2>Manual Address Lookup</h2>
    <label for="manualAddress">Wallet Address:</label>
    <input type="text" id="manualAddress" placeholder="0xABC123…" />
    <button id="checkBalanceBtn">Check Balances</button>

    <hr />

    <h2>Keystore Upload</h2>
    <label for="keystoreFileBalance">Keystore JSON:</label>
    <input type="file" id="keystoreFileBalance" accept=".json" />

    <label for="walletPasswordBalance">Wallet Password:</label>
    <input type="password" id="walletPasswordBalance" placeholder="Enter your password" />

    <button id="loadBalanceWalletBtn">Load & Check Wallet</button>

    <pre id="balances"></pre>
  </div>
</body>
