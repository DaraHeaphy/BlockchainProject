<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="contract-address" content="0x1ac131aE1a756687F11B58B891146edb52ABDDeB" />
  <meta name="rpc-url" content="https://sepolia.infura.io/v3/74ac8b5828754e85b0bcdbab511ba892" />
  <title>Create Wallet</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <h1 class="logo">Dara’s Ticketing App</h1>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="wallet.html">Create Wallet</a>
        <a href="balance.html">Check Balances</a>
        <a href="purchase.html">Purchase Tickets</a>
        <a href="transfer.html">Transfer Tickets</a>
        <a href="remaining.html">Tickets Remaining</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="section">
      <h1>Create Wallet</h1>
      <label for="newWalletPassword">Password:</label>
      <input type="password" id="newWalletPassword" placeholder="••••••••" />

      <button id="createWalletBtn" class="btn-primary">
        <i data-feather="plus-circle"></i>
        Create Wallet
      </button>
      <button id="downloadWalletBtn" class="btn-secondary">
        <i data-feather="download"></i>
        Download Keystore
      </button>

      <h2>Wallet Address</h2>
      <textarea
        id="walletAddress"
        class="balances-box"
        readonly
        rows="1"
        placeholder="Your new wallet address will appear here"
      ></textarea>

      <h2>Private Key</h2>
      <textarea
        id="privateKey"
        class="balances-box"
        readonly
        rows="1"
        placeholder="Your private key will appear here"
      ></textarea>

      <h2>Encrypted Keystore JSON</h2>
      <textarea
        id="keystoreJson"
        class="balances-box"
        readonly
        rows="6"
        placeholder="Your encrypted keystore JSON will appear here"
      ></textarea>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Dara’s Ticketing App</p>
    </div>
  </footer>

  <script>feather.replace();</script>
  <script src="js/abi.js"></script>
  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/wallet.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
