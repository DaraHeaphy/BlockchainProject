<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="contract-address" content="0x1ac131aE1a756687F11B58B891146edb52ABDDeB" />
  <meta name="rpc-url" content="https://sepolia.infura.io/v3/74ac8b5828754e85b0bcdbab511ba892" />
  <title>Transfer Tickets</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <h1 class="logo">Dara’s Ticketing App</h1>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="transfer.html">Transfer Tickets</a>
        <a href="wallet.html">Create Wallet</a>
        <a href="balance.html">Check Balances</a>
        <a href="purchase.html">Purchase Tickets</a>
        <a href="remaining.html">Tickets Remaining</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="section">
      <h1>Transfer Tickets</h1>

      <h2>Load Keystore</h2>
      <label for="keystoreFileTransfer">Keystore JSON:</label>
      <input type="file" id="keystoreFileTransfer" accept=".json" />

      <label for="walletPasswordTransfer">Password:</label>
      <input type="password" id="walletPasswordTransfer" placeholder="••••••••" />

      <button id="loadTransferWalletBtn" class="btn-secondary">
        <i data-feather="key"></i>
        Load Wallet
      </button>

      <textarea
        id="transferWalletInfo"
        class="balances-box"
        readonly
        rows="2"
        placeholder="Loaded wallet info will appear here"
      ></textarea>

      <section id="vendorSection" style="display:none; margin-top:1em;">
        <h2>Vendor Address</h2>
        <textarea
          id="vendorAddressDisplay"
          class="balances-box"
          readonly
          rows="1"
          placeholder="Vendor address will appear here"
        ></textarea>
      </section>

      <hr />

      <h2>Return Tickets to Vendor</h2>
      <label for="transferAmount">Tickets to return:</label>
      <input type="number" id="transferAmount" min="1" value="1" disabled />

      <button id="returnToVendorBtn" class="btn-tertiary" disabled>
        <i data-feather="corner-down-left"></i>
        Return to Vendor
      </button>

      <textarea
        id="transferStatus"
        class="balances-box"
        readonly
        rows="2"
        placeholder="Operation status will appear here"
      ></textarea>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Dara’s Ticketing App</p>
    </div>
  </footer>

  <script>feather.replace();</script>
  <script src="js/abi.js"></script>
  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/transfer.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
