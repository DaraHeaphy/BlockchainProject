<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="contract-address" content="0x1ac131aE1a756687F11B58B891146edb52ABDDeB" />
  <meta name="rpc-url" content="https://sepolia.infura.io/v3/https://sepolia.infura.io/v3/74ac8b5828754e85b0bcdbab511ba892" />
  <title>Purchase Tickets</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/abi.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/purchase.js"></script>
  <script type="module" src="js/main.js"></script>

<body>
  <header>
    <a href="index.html" class="back">← Home</a>
    <h1>Purchase Tickets</h1>
  </header>
  <div class="section">
    <label for="keystoreFile">Keystore JSON:</label>
    <input type="file" id="keystoreFile" accept=".json" />

    <label for="walletPassword">Wallet Password:</label>
    <input type="password" id="walletPassword" placeholder="Enter your password" />

    <button id="loadWalletBtn">Load Wallet</button>
    <pre id="walletInfo"></pre>

    <hr />

    <label for="purchaseAmount">Tickets (1–10):</label>
    <input type="number" id="purchaseAmount" min="1" max="10" value="1" disabled />

    <button id="purchaseBtn" disabled>Purchase</button>
    <pre id="purchaseStatus"></pre>
  </div>
</body>
</html>
