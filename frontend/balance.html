  <nav class="navbar">
    <div class="container nav-container">
      <h1 class="logo">Dara’s Ticketing App</h1>

  <main class="container">
    <div class="section">
      <h1>Balance Check/Doorman Check</h1>

      <h2>Keystore Upload</h2>
      <label for="keystoreFileBalance">Keystore JSON:</label>
      <input type="file" id="keystoreFileBalance" accept=".json" />

      <label for="walletPasswordBalance">Password:</label>
      <input type="password" id="walletPasswordBalance" placeholder="••••••••" />

      <button id="loadBalanceWalletBtn" class="btn-secondary">
        <i data-feather="refresh-cw"></i>
        Load & Check
      </button>

      <textarea
        id="balances"
        class="balances-box"
        readonly
        rows="6"
        placeholder="SETH & ticket balances will appear here"
      ></textarea>
    </div>
  </main>
